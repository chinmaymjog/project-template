# Starter workflow for an infrastructure or platform repo. Copy to
# .github/workflows/ci.yml. It only validates: format, static checks and lint.
# Keep plan, apply and deploy separate, behind an environment with a required
# reviewer, and never give a pull-request workflow cloud credentials.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - run: terraform fmt -check -recursive
      # Repeat per root module; -backend=false means no state or credentials.
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate

  # Helm charts: uncomment and point at the chart.
