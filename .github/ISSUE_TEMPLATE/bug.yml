name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands or steps. Redact tokens, hostnames and tenant or subscription IDs.
    validations:
      required: false
