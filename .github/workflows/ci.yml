name: CI

# Starter checks. The template ships the one check that works everywhere (the
# planning docs exist). Add the project's own checks in the TODO step, or copy
# a starter from ci/profiles/. Delete this file if the repo needs no CI.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Planning docs are in place
        run: |
          for f in docs/project-spec.md docs/architecture.md docs/ai-rules.md docs/tasks.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
            grep -q "Project:" "$f" || { echo "$f has no Project: line"; exit 1; }
          done
      # TODO: replace with the project's checks (tests, build, IaC validation).
      - name: Project checks
        run: echo "Add project-specific checks here; see ci/profiles/."
